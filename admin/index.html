<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center — BKDziti</title>
    <meta name="robots" content="noindex,nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon-32x32.png" sizes="32x32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/store.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1714;
            color: #fcf9f5;
            font-family: 'Golos Text', sans-serif;
            overflow: hidden;
        }

        .admin-wrapper {
            display: flex;
            height: 100vh;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1714 0%, #2a1f17 100%);
        }

        .login-card {
            background: rgba(60, 45, 35, 0.9);
            border: 1px solid rgba(249, 83, 1, 0.2);
            border-radius: 1rem;
            padding: 3rem 2.5rem;
            max-width: 380px;
            width: 90%;
        }

        .login-card h1 {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 2rem;
            color: var(--orange);
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: rgba(252, 249, 245, 0.6);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--orange);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(249, 83, 1, 0.25);
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            color: #fcf9f5;
            font-family: inherit;
            text-align: center;
            letter-spacing: 0.1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(249, 83, 1, 0.1);
        }

        .login-btn {
            padding: 0.9rem;
            margin-top: 0.5rem;
            background: var(--orange);
            color: #1a1714;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .login-btn:hover {
            background: #ff9a0b;
            transform: translateY(-2px);
        }

        .login-error {
            color: #f08080;
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 1.2em;
        }

        /* MAIN DASHBOARD */
        .dashboard {
            display: none;
            width: 100%;
            height: 100%;
        }

        .dashboard.active {
            display: flex;
        }

        .sidebar {
            width: 180px;
            background: rgba(30, 20, 15, 0.9);
            border-right: 1px solid rgba(249, 83, 1, 0.1);
            padding: 1.5rem 0.75rem;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(249, 83, 1, 0.15);
        }

        .sidebar-header .title {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 1rem;
            color: var(--orange);
            margin-bottom: 0.25rem;
        }

        .sidebar-header .subtitle {
            font-size: 0.65rem;
            color: rgba(252, 249, 245, 0.35);
            letter-spacing: 0.1em;
        }

        .sidebar h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(252, 249, 245, 0.4);
            padding: 0.75rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem;
            background: none;
            border: 1px solid transparent;
            color: rgba(252, 249, 245, 0.6);
            cursor: pointer;
            font-size: 0.9rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-btn:hover {
            color: var(--orange);
            border-color: rgba(249, 83, 1, 0.3);
        }

        .nav-btn.active {
            background: rgba(249, 83, 1, 0.1);
            color: var(--orange);
            border-color: rgba(249, 83, 1, 0.5);
        }

        .logout-btn {
            margin-top: auto;
            color: rgba(240, 128, 128, 0.7) !important;
        }

        .logout-btn:hover {
            color: #f08080 !important;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .section-title {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: var(--orange);
        }

        .message {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            animation: slideDown 0.3s ease-out;
        }

        .message.success {
            background: rgba(45, 122, 74, 0.15);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .message.error {
            background: rgba(240, 128, 128, 0.15);
            color: #f08080;
            border: 1px solid rgba(240, 128, 128, 0.3);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 150px;
            }
            .main-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="login-screen">
            <div class="login-card">
                <h1>BKDziti</h1>
                <p>Admin Control Center</p>
                <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" autofocus required>
                    </div>
                    <button type="submit" class="login-btn">
                        <i class="fas fa-unlock-alt"></i> Sign In
                    </button>
                    <div id="loginError" class="login-error"></div>
                </form>
                <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(249,83,1,0.1); text-align: center;">
                    <a href="/" style="font-size: 0.8rem; color: rgba(252,249,245,0.3); text-decoration: none;">
                        <i class="fas fa-arrow-left"></i> Back to BKDziti
                    </a>
                </div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="dashboard">
            <!-- SIDEBAR -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="title">BKDziti</div>
                    <div class="subtitle">ADMIN CENTER</div>
                </div>

                <h3>Manage</h3>
                <button class="nav-btn active" data-section="store" onclick="switchSection('store')">
                    <i class="fas fa-store"></i> Store
                </button>
                <button class="nav-btn" data-section="prospects" onclick="switchSection('prospects')">
                    <i class="fas fa-users"></i> Prospects
                </button>

                <h3>Site</h3>
                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i> Main Site
                </a>

                <button class="nav-btn logout-btn" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>

            <!-- MAIN CONTENT -->
            <div class="main-content">
                <!-- STORE SECTION -->
                <div id="storeSection" class="content-section active">
                    <h2 class="section-title">Store Management</h2>
                    <div id="storeMessage"></div>
                    <div id="storeContent"></div>
                </div>

                <!-- PROSPECTS SECTION -->
                <div id="prospectsSection" class="content-section">
                    <h2 class="section-title">Prospects Tracker</h2>
                    <div id="prospectsMessage"></div>
                    <div id="prospectsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/store-admin.js"></script>
    <script>
        // ============================================
        // UNIFIED ADMIN CONTROL CENTER
        // ============================================

        const LOGIN_SCREEN = document.getElementById('loginScreen');
        const DASHBOARD = document.getElementById('dashboard');
        const LOGIN_FORM = document.getElementById('loginForm');
        const PASSWORD_INPUT = document.getElementById('password');
        const LOGIN_ERROR = document.getElementById('loginError');

        // Initialize
        function init() {
            const token = sessionStorage.getItem('admin_token');
            if (token) {
                showDashboard();
            } else {
                showLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            LOGIN_ERROR.textContent = '';
            const password = PASSWORD_INPUT.value;

            try {
                const response = await fetch('/api/prospects/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: password })
                });

                const data = await response.json();
                if (!data.ok) throw new Error(data.error || 'Invalid password');

                sessionStorage.setItem('admin_token', data.token);
                PASSWORD_INPUT.value = '';
                showDashboard();
            } catch (err) {
                LOGIN_ERROR.textContent = err.message || 'Authentication failed';
                PASSWORD_INPUT.value = '';
            }
        }

        function showLogin() {
            LOGIN_SCREEN.style.display = 'flex';
            DASHBOARD.style.display = 'none';
            PASSWORD_INPUT.focus();
        }

        function showDashboard() {
            LOGIN_SCREEN.style.display = 'none';
            DASHBOARD.style.display = 'flex';
            loadStoreAdmin();
            loadProspectsTracker();
        }

        function handleLogout() {
            if (confirm('Sign out of admin center?')) {
                sessionStorage.removeItem('admin_token');
                showLogin();
            }
        }

        function switchSection(section) {
            // Update buttons
            document.querySelectorAll('.nav-btn[data-section]').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-section="${section}"]`).classList.add('active');

            // Update sections
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });
            document.getElementById(`${section}Section`).classList.add('active');
        }

        function loadStoreAdmin() {
            const storeContent = document.getElementById('storeContent');
            const storeMessage = document.getElementById('storeMessage');

            // The store admin JS should initialize itself
            // For now, we'll add a note that store management is loaded
            if (window.initStoreAdmin && typeof window.initStoreAdmin === 'function') {
                try {
                    window.initStoreAdmin();
                } catch (err) {
                    storeMessage.innerHTML = `<div class="message error">Error loading store: ${err.message}</div>`;
                }
            }
        }

        function loadProspectsTracker() {
            const prospectsContent = document.getElementById('prospectsContent');
            const prospectsMessage = document.getElementById('prospectsMessage');

            // Create a simple prospects tracker interface
            prospectsContent.innerHTML = `
                <div style="text-align: center; padding: 3rem; color: rgba(252, 249, 245, 0.6);">
                    <p style="margin-bottom: 1.5rem; font-size: 1rem;">
                        <i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i>
                        Loading prospects tracker...
                    </p>
                    <p style="font-size: 0.9rem; margin-bottom: 1rem;">This feature requires full page load.</p>
                    <a href="prospects-app.html" class="pay-btn" style="display: inline-block; margin-top: 1rem;">
                        <i class="fas fa-external-link-alt"></i> Open Prospects Tracker
                    </a>
                </div>
            `;
        }

        // Start
        init();
    </script>
</body>
</html>
