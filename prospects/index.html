                      </div>
                    )
                  ))}

                </div>
              </div>
            )}


            {/* ANALYTICS TAB */}
            {tab === 'campaign' && (
              <div>
                <h2 style={{ fontSize: '22px', marginBottom: '28px', fontWeight: '600' }}>Pipeline Analytics</h2>

            {/* CAMPAIGN TAB */}
            {tab === 'campaign' && (
              <div>
                <h2 style={{ fontSize: '24px', marginBottom: '24px' }}>Campaign Dashboard</h2>


                <div className="dashboard-grid">
                  <div className="kpi-card">
                    <h3>{stats.totalProspects}</h3>
                    <p>Total Prospects</p>
                  </div>
                  <div className="kpi-card">

                    <h3>{stats.active}</h3>
                    <p>Active</p>
                  </div>
                  <div className="kpi-card">
                    <h3>{stats.totalCalls}</h3>
                    <p>Total Calls</p>
                  </div>
                  <div className="kpi-card">
                    <h3>{stats.closed}</h3>
                    <p>Closed</p>
                  </div>
                  <div className="kpi-card">
                    <h3>{stats.conversion}%</h3>
                    <p>Conversion</p>
                  </div>
                </div>

                <div className="chart-section">
                  <h4>Heat Distribution</h4>
                  {[5, 4, 3, 2, 1].map(level => (
                    <div key={level} className="chart-bar">
                      <div className="chart-label">{level} {'🔥'.repeat(level)}</div>
                      <div className="chart-bar-fill" style={{ width: `${Math.max(5, (stats.heatDist[level] / Math.max(stats.totalProspects, 1)) * 100)}%` }}>
                        {stats.heatDist[level] > 0 && (
                          <div className="chart-bar-value">{stats.heatDist[level]}</div>

                    <h3>{stats.activeProspects}</h3>
                    <p>Active</p>
                  </div>
                  <div className="kpi-card">
                    <h3>{stats.closedDeals}</h3>
                    <p>Closed Deals</p>
                  </div>
                  <div className="kpi-card">
                    <h3>{stats.conversionRate}%</h3>
                    <p>Conversion Rate</p>
                  </div>
                  <div className="kpi-card">
                    <h3>{stats.totalCalls}</h3>
                    <p>Total Calls</p>
                  </div>
                </div>

                <div className="chart-section">
                  <h4>Prospects by Heat Level</h4>
                  {[5, 4, 3, 2, 1].map(level => (
                    <div key={level} className="chart-bar">
                      <div className="chart-label">{level} {'🔥'.repeat(level)}</div>
                      <div className="chart-bar-fill" style={{ width: `${(stats.heatByLevel[level] / Math.max(stats.totalProspects, 1)) * 100}%` }}>
                        {stats.heatByLevel[level] > 0 && (
                          <div className="chart-bar-value">{stats.heatByLevel[level]}</div>

                        )}
                      </div>
                    </div>
                  ))}
                </div>


                {Object.keys(stats.objections).length > 0 && (
                  <div className="chart-section">
                    <h4>Common Objections</h4>
                    {Object.entries(stats.objections)
                      .sort(([, a], [, b]) => b - a)
                      .slice(0, 6)
                      .map(([objection, count]) => (
                        <div key={objection} className="chart-bar">
                          <div className="chart-label">{objection}</div>
                          <div className="chart-bar-fill" style={{ width: `${Math.max(5, (count / Math.max(...Object.values(stats.objections), 1)) * 100)}%` }}>
                            <div className="chart-bar-value">{count}</div>
                          </div>
                        </div>
                      ))}
                  </div>
                )}

                <div className="chart-section">
                  <h4>Quick Metrics</h4>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px' }}>
                    <div>
                      <div className="detail-label">Avg Calls Per Prospect</div>
                      <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--rust)', marginTop: '8px' }}>
                        {stats.totalProspects > 0 ? (stats.totalCalls / stats.totalProspects).toFixed(1) : 0}
                      </div>
                    </div>
                    <div>
                      <div className="detail-label">Total Active Prospects</div>
                      <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--rust)', marginTop: '8px' }}>
                        {stats.active}
                      </div>
                    </div>
                    <div>
                      <div className="detail-label">Closure Rate</div>
                      <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--rust)', marginTop: '8px' }}>
                        {stats.conversion}%
                      </div>
                    </div>

                <div className="chart-section">
                  <h4>Most Common Objections</h4>
                  {Object.entries(stats.allObjections)
                    .sort(([, a], [, b]) => b - a)
                    .slice(0, 5)
                    .map(([objection, count]) => (
                      <div key={objection} className="chart-bar">
                        <div className="chart-label">{objection}</div>
                        <div className="chart-bar-fill" style={{ width: `${(count / Math.max(...Object.values(stats.allObjections), 1)) * 100}%` }}>
                          <div className="chart-bar-value">{count}</div>
                        </div>
                      </div>
                    ))}
                  {Object.keys(stats.allObjections).length === 0 && (
                    <p style={{ color: 'var(--muted)', fontSize: '13px' }}>No objections logged yet. Start logging calls to see patterns.</p>
                  )}
                </div>

                <div className="chart-section">
                  <h4>Prospect Status Breakdown</h4>
                  <div style={{ fontSize: '13px', color: 'var(--muted)', lineHeight: '1.8' }}>
                    <p><strong>Active:</strong> {stats.activeProspects} prospects ({((stats.activeProspects / stats.totalProspects) * 100).toFixed(0)}%)</p>
                    <p><strong>Closed:</strong> {stats.closedDeals} deals ({((stats.closedDeals / stats.totalProspects) * 100).toFixed(0)}%)</p>
                    <p><strong>Total Calls Logged:</strong> {stats.totalCalls}</p>
                    <p><strong>Avg Calls per Prospect:</strong> {stats.totalProspects > 0 ? (stats.totalCalls / stats.totalProspects).toFixed(1) : 0}</p>

                  </div>
                </div>
              </div>
            )}

            {/* EMAIL TAB */}
            {tab === 'email' && (
              <div>

                <h2 style={{ fontSize: '22px', marginBottom: '28px', fontWeight: '600' }}>Email Templates</h2>

                <div className="form-section">
                  <h3>Template Generator</h3>

                <h2 style={{ fontSize: '24px', marginBottom: '24px' }}>Email Templates</h2>

                <div className="form-section">
                  <h3>Email Template Generator</h3>


                  <div className="form-grid">
                    <div className="form-group form-full">
                      <label>Select Template</label>

                      <select
                        value={emailTemplate}
                        onChange={(e) => setEmailTemplate(e.target.value)}
                      >

                      <select value={emailTemplate} onChange={(e) => setEmailTemplate(e.target.value)}>

                        <option value="first-contact">First Contact</option>
                        <option value="after-objection">After Objection</option>
                        <option value="follow-up">Follow-up</option>
                        <option value="reengagement">Re-engagement</option>
                      </select>
                    </div>

                    {Object.entries(emailVariables).map(([key, value]) => (
                      <div key={key} className="form-group">

                        <label>{key.replace(/-/g, ' ')}</label>

                        <label>{key}</label>

                        <input
                          type="text"
                          value={value}
                          onChange={(e) => setEmailVariables({ ...emailVariables, [key]: e.target.value })}

                          placeholder={`[${key}]`}

                          placeholder={key}

                        />
                      </div>
                    ))}
                  </div>

                  <div className="button-group">

                    <button
                      className="btn btn-primary"
                      onClick={() => {
                        const text = Object.entries(emailVariables).reduce((acc, [key, val]) => {
                          return acc.replace(`[${key}]`, val);
                        }, `Subject: ${EMAIL_TEMPLATES[emailTemplate].subject}\n\n${EMAIL_TEMPLATES[emailTemplate].body}`);
                        navigator.clipboard.writeText(text);
                        setStatus({ type: 'success', text: '✓ Email copied to clipboard' });
                        setTimeout(() => setStatus(''), 2000);
                      }}
                    >

                    <button className="btn btn-secondary" onClick={() => {
                      const text = Object.entries(emailVariables).reduce((acc, [key, value]) => {
                        return acc.replace(`[${key}]`, value);
                      }, `Subject: ${EMAIL_TEMPLATES[emailTemplate].subject}\n\n${EMAIL_TEMPLATES[emailTemplate].body}`);
                      navigator.clipboard.writeText(text);
                      setStatus({ type: 'success', text: 'Email copied to clipboard!' });
                      setTimeout(() => setStatus(''), 2000);
                    }}>

                      📋 Copy Email
                    </button>
                  </div>
                </div>

                <div className="form-section">
                  <h3>Preview</h3>

                  <div style={{ background: '#fafaf7', padding: '20px', borderRadius: '8px', fontSize: '13px', lineHeight: '1.7', color: 'var(--ink)' }}>
                    <p><strong>Subject:</strong> {Object.entries(emailVariables).reduce((acc, [key, val]) => acc.replace(`[${key}]`, val), EMAIL_TEMPLATES[emailTemplate].subject)}</p>
                    <hr style={{ margin: '16px 0', border: 'none', borderTop: '1px solid #ddd' }} />
                    {Object.entries(emailVariables).reduce((acc, [key, val]) => acc.replace(`[${key}]`, val), EMAIL_TEMPLATES[emailTemplate].body).split('\n').map((line, i) => (
                      <p key={i} style={{ margin: '0 0 12px 0' }}>{line || <br />}</p>

                  <div className="template-preview">
                    <p><strong>Subject:</strong> {Object.entries(emailVariables).reduce((acc, [key, value]) => {
                      return acc.replace(`[${key}]`, value);
                    }, EMAIL_TEMPLATES[emailTemplate].subject)}</p>
                    <hr style={{ margin: '16px 0', border: 'none', borderTop: '1px solid #ddd' }} />
                    {Object.entries(emailVariables).reduce((acc, [key, value]) => {
                      return acc.replace(`[${key}]`, value);
                    }, EMAIL_TEMPLATES[emailTemplate].body).split('\n').map((line, idx) => (
                      <p key={idx}>{line}</p>

                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* EXPORT TAB */}
            {tab === 'export' && (
              <div>

                <h2 style={{ fontSize: '22px', marginBottom: '28px', fontWeight: '600' }}>Export Data</h2>

                <div className="form-section">
                  <h3>Download Your Data</h3>
                  <p style={{ marginBottom: '20px', color: 'var(--muted)', fontSize: '13px' }}>
                    Export your prospect list for backup or analysis.

                <h2 style={{ fontSize: '24px', marginBottom: '24px' }}>Export & Reports</h2>

                <div className="form-section">
                  <h3>Export Your Prospects</h3>
                  <p style={{ marginBottom: '20px', color: 'var(--muted)', fontSize: '14px' }}>
                    Download your complete prospect list as a PDF. Perfect for printing, sharing, or keeping offline records.

                  </p>

                  <div className="button-group">
                    <button className="btn btn-primary" onClick={handleExportPDF}>

                      📄 Export as PDF
                    </button>
                    <button
                      className="btn btn-secondary"
                      onClick={() => {
                        const csv = [
                          ['Name', 'Category', 'Phone', 'Status', 'Heat', 'Calls', 'Last Contact'].join(','),
                          ...prospects.map(p => [
                            `"${p.name}"`,
                            `"${p.category}"`,
                            p.phone,
                            p.status,
                            p.heatLevel,
                            p.calls?.length || 0,
                            p.lastContact ? new Date(p.lastContact).toLocaleDateString() : ''
                          ].join(','))
                        ].join('\n');

                        const blob = new Blob([csv], { type: 'text/csv' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `BKDziti-Prospects-${new Date().toISOString().split('T')[0]}.csv`;
                        a.click();
                        URL.revokeObjectURL(url);
                        setStatus({ type: 'success', text: '✓ CSV exported' });
                        setTimeout(() => setStatus(''), 2000);
                      }}
                    >

                      📥 Export as PDF
                    </button>
                    <button className="btn btn-secondary" onClick={() => {
                      const csv = [
                        ['Name', 'Category', 'Phone', 'Address', 'Heat Level', 'Status', 'Calls', 'Last Contact'].join(','),
                        ...prospects.map(p => [
                          `"${p.name}"`,
                          `"${p.category}"`,
                          p.phone,
                          `"${p.address}"`,
                          p.heatLevel,
                          p.status,
                          p.calls?.length || 0,
                          p.lastContact ? new Date(p.lastContact).toLocaleDateString() : 'Never'
                        ].join(','))
                      ].join('\n');

                      const blob = new Blob([csv], { type: 'text/csv' });
                      const url = window.URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `BKDziti-Prospects-${new Date().toISOString().split('T')[0]}.csv`;
                      a.click();
                      setStatus({ type: 'success', text: 'CSV exported!' });
                      setTimeout(() => setStatus(''), 2000);
                    }}>

                      📊 Export as CSV
                    </button>
                  </div>
                </div>

                <div className="form-section">

                  <h3>Data Summary</h3>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: '16px', fontSize: '13px' }}>
                    <div>
                      <div className="detail-label">Total Prospects</div>
                      <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--rust)', marginTop: '8px' }}>{prospects.length}</div>
                    </div>
                    <div>
                      <div className="detail-label">Total Calls</div>
                      <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--rust)', marginTop: '8px' }}>
                        {prospects.reduce((sum, p) => sum + (p.calls?.length || 0), 0)}
                      </div>
                    </div>
                    <div>
                      <div className="detail-label">Closed Deals</div>
                      <div style={{ fontSize: '24px', fontWeight: '700', color: 'var(--rust)', marginTop: '8px' }}>
                        {prospects.filter(p => p.outcome === 'closed').length}
                      </div>
                    </div>
                    <div>
                      <div className="detail-label">Last Updated</div>
                      <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '8px' }}>
                        {new Date().toLocaleDateString()} {new Date().toLocaleTimeString()}
                      </div>
                    </div>

                  <h3>Quick Stats</h3>
                  <div style={{ fontSize: '14px', color: 'var(--muted)', lineHeight: '2' }}>
                    <p><strong>Total Prospects:</strong> {prospects.length}</p>
                    <p><strong>Total Calls Logged:</strong> {prospects.reduce((sum, p) => sum + (p.calls?.length || 0), 0)}</p>
                    <p><strong>Conversion Rate:</strong> {stats.conversionRate}%</p>
                    <p><strong>Data Last Updated:</strong> {new Date().toLocaleString()}</p>

                  </div>
                </div>
              </div>
            )}
          </div>

          <footer>

            BKDziti Prospect Tracker — Password Protected — Admin Only

            BKDziti — Prospect Tracker | Password Protected — Admin Only

          </footer>
        </>
      );
    }

    ReactDOM.render(<ProspectApp />, document.getElementById('root'));
  </script>
</body>
</html>
