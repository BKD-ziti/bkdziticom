<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee County Corruption Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid #d4a574;
        }

        h1 {
            color: #d4a574;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .admin-link {
            display: inline-block;
            margin-top: 15px;
        }

        .admin-link a {
            color: #d4a574;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 16px;
            border: 1px solid #d4a574;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .admin-link a:hover {
            background: #d4a574;
            color: #0f1419;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #1a1f29;
            border: 1px solid #333;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #d4a574;
            color: #0f1419;
            border-color: #d4a574;
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 100%;
            background: #d4a574;
        }

        .timeline-entry {
            margin-bottom: 40px;
            position: relative;
        }

        .timeline-entry:nth-child(odd) .entry-content {
            margin-left: 0;
            margin-right: auto;
            width: 48%;
            text-align: right;
        }

        .timeline-entry:nth-child(even) .entry-content {
            margin-left: auto;
            margin-right: 0;
            width: 48%;
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: #d4a574;
            border: 3px solid #0f1419;
            border-radius: 50%;
            z-index: 1;
        }

        .entry-content {
            background: #1a1f29;
            border: 1px solid #d4a574;
            padding: 20px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .entry-content:hover {
            border-color: #e8c08a;
            box-shadow: 0 0 15px rgba(212, 165, 116, 0.2);
        }

        .entry-date {
            color: #d4a574;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .entry-title {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .entry-category {
            display: inline-block;
            background: #d4a574;
            color: #0f1419;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .entry-source {
            color: #999;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .entry-description {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .entry-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .entry-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #d4a574;
            text-decoration: none;
            font-size: 12px;
            padding: 6px 10px;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 3px;
            transition: all 0.2s;
        }

        .entry-link:hover {
            background: rgba(212, 165, 116, 0.2);
            text-decoration: underline;
        }

        .entry-notes {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #333;
            color: #aaa;
            font-size: 12px;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-card {
            text-align: center;
        }

        .stat-number {
            color: #d4a574;
            font-size: 32px;
            font-weight: 600;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }

            .timeline-dot {
                left: 20px;
            }

            .timeline-entry:nth-child(odd) .entry-content,
            .timeline-entry:nth-child(even) .entry-content {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                margin-top: 30px;
            }

            .entry-content {
                text-align: left;
            }

            .entry-title {
                font-size: 16px;
            }

            h1 {
                font-size: 1.8em;
            }

            .filters {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lee County Corruption Timeline</h1>
            <p class="subtitle">Documenting incidents, investigations, and scandals</p>
            <div class="admin-link">
                <a href="admin.html">Admin Panel</a>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Entries</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="yearRange">—</div>
                <div class="stat-label">Year Range</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="categoryCount">0</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>

        <div class="filters" id="filterContainer"></div>

        <div class="timeline" id="timelineContainer"></div>

        <div id="emptyState" class="empty-state">
            <div class="empty-state-text">No entries yet. Check back soon.</div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'leecountyresearch_entries';
        let allEntries = [];
        let filteredEntries = [];
        let activeFilter = null;

        // Load on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadEntries();
            buildFilters();
            displayTimeline();
            updateStats();
        });

        function loadEntries() {
            allEntries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            allEntries.sort((a, b) => new Date(b.date) - new Date(a.date));
            filteredEntries = [...allEntries];
        }

        function buildFilters() {
            const categories = [...new Set(allEntries.map(e => e.category))];
            const container = document.getElementById('filterContainer');
            
            if (categories.length === 0) return;

            // "All" button
            let html = `<button class="filter-btn active" onclick="filterByCategory(null)">All Entries</button>`;
            
            // Category buttons
            categories.forEach(cat => {
                const count = allEntries.filter(e => e.category === cat).length;
                const label = cat.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                html += `<button class="filter-btn" onclick="filterByCategory('${cat}')">${label} (${count})</button>`;
            });

            container.innerHTML = html;
        }

        function filterByCategory(category) {
            activeFilter = category;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter entries
            if (category === null) {
                filteredEntries = [...allEntries];
            } else {
                filteredEntries = allEntries.filter(e => e.category === category);
            }

            displayTimeline();
        }

        function displayTimeline() {
            const container = document.getElementById('timelineContainer');
            const emptyState = document.getElementById('emptyState');

            if (filteredEntries.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            container.innerHTML = filteredEntries.map((entry, index) => `
                <div class="timeline-entry">
                    <div class="timeline-dot"></div>
                    <div class="entry-content">
                        <div class="entry-date">${formatDate(entry.date)}</div>
                        <div class="entry-title">${escapeHtml(entry.title)}</div>
                        <div class="entry-category">${entry.category.split('-').join(' ').toUpperCase()}</div>
                        <div class="entry-source">Source: ${escapeHtml(entry.source)}</div>
                        <div class="entry-description">${escapeHtml(entry.description)}</div>
                        <div class="entry-links">
                            ${entry.articleUrl ? `<a href="${entry.articleUrl}" target="_blank" class="entry-link">📄 Article</a>` : ''}
                            ${entry.videoUrl ? `<a href="${entry.videoUrl}" target="_blank" class="entry-link">🎥 Video</a>` : ''}
                        </div>
                        ${entry.notes ? `<div class="entry-notes">Note: ${escapeHtml(entry.notes)}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allEntries.length;
            
            if (allEntries.length > 0) {
                const dates = allEntries.map(e => new Date(e.date).getFullYear());
                const minYear = Math.min(...dates);
                const maxYear = Math.max(...dates);
                document.getElementById('yearRange').textContent = minYear === maxYear ? minYear : `${minYear}–${maxYear}`;
            }

            const categories = new Set(allEntries.map(e => e.category)).size;
            document.getElementById('categoryCount').textContent = categories;
        }

        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', options);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
